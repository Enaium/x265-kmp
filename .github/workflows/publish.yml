name: Publish

"on":
  workflow_dispatch:

# Publishes every artifact from the runner that can build it. Maven Central
# coordinates are immutable, so each `:jni-jvm-{classifier}` and each native
# target klib is published from exactly one runner:
#
#   macos-14       -> :x265-kmp (jvm, macos/ios/tvos/watchos, js, wasmJs)
#                     :jni-jvm-darwin-aarch64, :jni-jvm-darwin-x86_64
#   ubuntu-latest  -> :x265-kmp (android AAR, linuxX64/linuxArm64/mingwX64)
#                     :jni-jvm-linux-x86_64, :jni-jvm-linux-aarch64
#   windows-latest -> :jni-jvm-windows-x86_64 (via MinGW)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key

jobs:
  publish-macos:
    name: Publish macOS (JVM + Apple + web + darwin JNI)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the x265 submodule
        run: |
          git config -f .gitmodules submodule.x265.url https://bitbucket.org/multicoreware/x265_git.git
          git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install nasm
        run: brew install nasm

      - name: Setup Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish macOS, Apple, web and JVM artifacts
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :x265-kmp:publishAllPublicationsToMavenCentralRepository
          -x :x265-kmp:publishAndroidPublicationToMavenCentralRepository
          -x :x265-kmp:publishLinuxX64PublicationToMavenCentralRepository
          -x :x265-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          -x :x265-kmp:publishMingwX64PublicationToMavenCentralRepository
          -x :x265-kmp:publishAndroidNativeArm64PublicationToMavenCentralRepository
          -x :x265-kmp:publishAndroidNativeArm32PublicationToMavenCentralRepository
          -x :x265-kmp:publishAndroidNativeX64PublicationToMavenCentralRepository
          -x :x265-kmp:publishAndroidNativeX86PublicationToMavenCentralRepository
          :jni-jvm-darwin-aarch64:publishToMavenCentral
          :jni-jvm-darwin-x86_64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux (Android AAR + Linux/mingw + linux JNI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the x265 submodule
        run: |
          git config -f .gitmodules submodule.x265.url https://bitbucket.org/multicoreware/x265_git.git
          git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install cross-compilers and nasm
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "ndk;27.0.12077973" >/dev/null

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish Android, Linux and MinGW artifacts
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :x265-kmp:publishAndroidPublicationToMavenCentralRepository
          :x265-kmp:publishLinuxX64PublicationToMavenCentralRepository
          :x265-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          :x265-kmp:publishMingwX64PublicationToMavenCentralRepository
          :x265-kmp:publishAndroidNativeArm64PublicationToMavenCentralRepository
          :x265-kmp:publishAndroidNativeArm32PublicationToMavenCentralRepository
          :x265-kmp:publishAndroidNativeX64PublicationToMavenCentralRepository
          :x265-kmp:publishAndroidNativeX86PublicationToMavenCentralRepository
          :jni-jvm-linux-x86_64:publishToMavenCentral
          :jni-jvm-linux-aarch64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-windows:
    name: Publish Windows JNI
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the x265 submodule
        run: |
          git config -f .gitmodules submodule.x265.url https://bitbucket.org/multicoreware/x265_git.git
          git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install MinGW and nasm
        shell: pwsh
        run: |
          choco install mingw nasm -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length
          Format-Hex -Path "$env:RUNNER_TEMP\signing-key.gpg" -Count 16

      - name: Publish the Windows JNI artifact
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
