org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.enableCInteropCommonization.nowarn=true

android.ndkVersion=27.0.12077973

# The project wires the shared web/native source sets explicitly below.
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Use the Node/npm toolchain installed on the machine instead of downloading
# the Kotlin-pinned Node distribution from Maven Central.
kotlin.js.yarn=false
